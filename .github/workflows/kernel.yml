name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            flex \
            curl \
            zip \
            unzip \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3 \
            ccache \
            libssl-dev \
            make \
            git

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out nethunter_defconfig

          PATH=$PWD/clang/bin:$PATH make -j$(nproc --all) \
            O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ginkgoa16-kernel
          path: out/arch/arm64/boot/Image.gz-dtb
